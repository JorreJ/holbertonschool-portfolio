{% extends 'base.html' %}

{% load static %}

{% block content %}
{% if messages %}
<ul class="messages">
    {% for message in messages %}
    <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}
<div class="update-page">
    <form method="POST">
        {% csrf_token %}
        {% include "book_form.html" with button_text="Ajouter" %}
    </form>
</div>
{% endblock %}

{% block script %}
<script src="{% static 'scripts.js' %}"></script>
{% endblock %}
